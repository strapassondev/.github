<!doctype html>
<!-- Banner do perfil da org (1280x320). Escuro: este arquivo. Claro: o build.sh troca o data-theme do <html> para "light".
     Grade de 96 px com linhas em 16 + 96n. O 3D ocupa as três últimas colunas, sangrando na borda.
     Sem foto por enquanto: se um dia houver foto do Pedro, ela NÃO entra aqui (o banner é da empresa). -->
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Banner GitHub</title>
<link rel="stylesheet" href="file:///C:/psds/brand-v2/marca/build/tokens.css">
<style>
  [data-theme="dark"]  { --grid: rgba(48,52,58,.7);    --render: url(file:///C:/psds/brand-v2/3d/web/hero-escuro.jpg); }
  [data-theme="light"] { --grid: rgba(213,216,214,.55); --render: url(file:///C:/psds/brand-v2/3d/web/hero-claro.jpg); }
  html, body { margin: 0; }
  body {
    width: 1280px; height: 320px; overflow: hidden; position: relative;
    background-color: var(--bg); color: var(--ink); font-family: var(--font-sans);
    background-image: linear-gradient(to right, var(--grid) 1px, transparent 1px),
                      linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
    background-size: 96px 96px; background-position: 16px 16px;
  }
  .logo { position: absolute; left: 112px; top: 44px; height: 40px; }
  [data-theme="dark"] .logo.claro, [data-theme="light"] .logo.escuro { display: none; }
  h1 {
    position: absolute; left: 107px; bottom: 40px; margin: 0;
    font-weight: 500; font-size: 80px; line-height: 80px; letter-spacing: -0.032em;
  }
  .sub {
    position: absolute; left: 592px; bottom: 44px; margin: 0;
    font-size: 22px; line-height: 30px; color: var(--ink-muted);
  }
  .rotulo {
    position: absolute; left: 592px; top: 54px; margin: 0;
    font: 500 17px/20px var(--font-mono); letter-spacing: var(--tracking-label);
    text-transform: uppercase; color: var(--ink-muted);
  }
  .peca {
    position: absolute; left: 977px; top: 0; width: 303px; height: 320px;
    background: var(--render) -150px -22px / 640px auto no-repeat;
  }
</style>
</head>
<body>
  <img class="logo claro" src="file:///C:/psds/brand-v2/marca/svg/logo-horizontal.svg" alt="">
  <img class="logo escuro" src="file:///C:/psds/brand-v2/marca/svg/logo-horizontal-neg.svg" alt="">
  <p class="rotulo">strapasson.dev</p>
  <h1>Tecnologia<br>sob medida.</h1>
  <p class="sub">Sistemas, automações e IA<br>para empresas.</p>
  <div class="peca"></div>
</body>
</html>
